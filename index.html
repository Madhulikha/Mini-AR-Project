<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AR Object Demo</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
    .panel {
      position: fixed; z-index: 10; top: 12px; left: 12px; right: 12px;
      padding: 12px 14px; border-radius: 14px; color: white;
      background: rgba(15, 23, 42, .82); backdrop-filter: blur(8px);
      font-size: 14px; line-height: 1.4;
    }
    .panel strong { display: block; font-size: 16px; margin-bottom: 3px; }
    .hint { opacity: .88; }
  </style>
</head>
<body>
  <div class="panel">
    <strong>Mini AR Object Demo</strong>
    <div class="hint">Allow camera access, then point your camera at the Hiro marker. A 3D object will appear on it.</div>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono;">
    <a-marker preset="hiro">
      <a-entity
        position="0 0.55 0"
        rotation="0 45 0"
        animation="property: rotation; to: 0 405 0; loop: true; dur: 5000; easing: linear">
        <a-box position="0 0.35 0" depth="0.7" height="0.7" width="0.7"
               color="#4F46E5" material="metalness: 0.25; roughness: 0.35">
          <a-animation attribute="scale" direction="alternate" dur="1200"
                       repeat="indefinite" to="1.12 1.12 1.12"></a-animation>
        </a-box>
        <a-cone position="0 0.95 0" radius-bottom="0.28" radius-top="0.02"
                height="0.45" color="#F59E0B"></a-cone>
      </a-entity>
      <a-ring position="0 0.02 0" rotation="-90 0 0" radius-inner="0.62"
              radius-outer="0.68" color="#22C55E"></a-ring>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
